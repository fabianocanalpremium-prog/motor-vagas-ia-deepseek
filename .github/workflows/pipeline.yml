name: Pipeline de Vagas

on:
  schedule:
    # 08:00 no horário de Brasília (UTC-3)
    - cron: '0 11 * * *'
      timezone: "America/Sao_Paulo"
    # 15:00 no horário de Brasília (UTC-3)
    - cron: '0 18 * * *'
      timezone: "America/Sao_Paulo"
  workflow_dispatch: # Permite rodar manualmente para testar

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências do Sistema (Pandoc e LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Instalar dependências do Python
        run: |
          pip install -r requirements.txt

      - name: Recriar arquivos de credenciais
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" > credentials.json
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Executar o pipeline
        run: python scripts/pipeline.py