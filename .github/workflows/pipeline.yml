name: Pipeline de Vagas

on:
  schedule:
    - cron: '0 11 * * *'
      timezone: "America/Sao_Paulo"
    - cron: '0 18 * * *'
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

jobs:
  executar-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências do Sistema (Pandoc e LaTeX)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex

      - name: Instalar dependências do Python
        run: |
          pip install -r requirements.txt

      - name: Recriar arquivos de credenciais de forma segura
        run: |
          cat << 'EOF' > credentials.json
          ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          EOF
          
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Executar o pipeline
        run: python scripts/pipeline.py